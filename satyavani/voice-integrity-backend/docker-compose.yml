version: '3.9'

services:
  # ============ DATABASE ============
  postgres:
    image: postgres:15-alpine
    container_name: voice-integrity-db
    environment:
      POSTGRES_USER: voice_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: voice_integrity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_user -d voice_integrity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ CACHE / MESSAGE QUEUE ============
  redis:
    image: redis:7-alpine
    container_name: voice-integrity-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ OBJECT STORAGE (Local MinIO - S3-compatible) ============
  minio:
    image: minio/minio:latest
    container_name: voice-integrity-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ INFERENCE SERVICE (ML Model) ============
  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    container_name: voice-integrity-inference
    ports:
      - "8001:8000"
    environment:
      MODEL_DEVICE: cpu  # Change to 'cuda' if GPU available
      PYTHONUNBUFFERED: 1
    volumes:
      - ./ml:/app/ml
      - inference_cache:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
    depends_on:
      - postgres

  # ============ API SERVER ============
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: voice-integrity-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://voice_user:dev_password_123@postgres:5432/voice_integrity
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: voice-integrity
      INFERENCE_URL: http://inference:8000
      SECRET_KEY: your-super-secret-key-change-in-prod
      PYTHONUNBUFFERED: 1
    volumes:
      - ./api:/app
      - audio_uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============ BACKGROUND WORKER ============
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: voice-integrity-worker
    environment:
      DATABASE_URL: postgresql://voice_user:dev_password_123@postgres:5432/voice_integrity
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET: voice-integrity
      INFERENCE_URL: http://inference:8000
      PYTHONUNBUFFERED: 1
    volumes:
      - ./worker:/app
      - audio_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      inference:
        condition: service_healthy

  # ============ MONITORING (Prometheus) ============
  prometheus:
    image: prom/prometheus:latest
    container_name: voice-integrity-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # ============ MONITORING (Grafana) ============
  grafana:
    image: grafana/grafana:latest
    container_name: voice-integrity-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ============ NGINX (Reverse Proxy / Load Balancer) ============
  nginx:
    image: nginx:alpine
    container_name: voice-integrity-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  inference_cache:
  audio_uploads:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: voice-integrity-net